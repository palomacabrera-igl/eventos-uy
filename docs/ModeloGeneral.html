t;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;-&amp;amp;nbsp; El costo del registro se calcula en base al tipo de registro&amp;lt;br&amp;gt;elegido. &amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;-&amp;amp;nbsp; Si el asistente pertenece a una institución patrocinadora y utiliza el código de&amp;lt;br&amp;gt;patrocinio de su institución para registrarse su costo de registro será cero.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;br&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;b&amp;gt;&amp;lt;i&amp;gt;Reglas de Negocio:&amp;lt;/i&amp;gt;&amp;lt;/b&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;- El valor de los registros gratuitos no puede superar el 20 % del aporte de la&amp;lt;br&amp;gt;institución.&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;- Si una institución realiza un aporte económico recibirá un código&amp;lt;br&amp;gt;de patrocinio para que sus integrantes puedan registrarse gratuitamente en esa edición&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;-un Asistente no puede registrarse más de una vez&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;en una misma EdicionEvento&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;-no se puede superar el cupo de un TipoRegistro&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;-una Institucion puede tener como máximo un Patrocinio&amp;amp;nbsp;&amp;lt;/span&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;para una misma EdicionEvento&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;-Una EdicionEvento nueva queda en estado INGRESADA&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;- Solo se puede aceptar o rechazar una EdicionEvento que esté INGRESADA, y después no cambia más de estado.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;background-color: transparent; color: light-dark(rgb(0, 0, 0), rgb(255, 255, 255));&amp;quot;&amp;gt;- Solo se puede registrar un asistente a una EdicionEvento ACEPTADA&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- Un usuario no puede seguirse a sí mismo ni seguir dos veces al mismo usuario.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- Un Evento finalizado no aparece en los listados ni en las búsquedas y no admite ediciones nuevas. Solo lo finaliza su organizador (el que lo dio de alta).&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- Solo se puede archivar una EdicionEvento ACEPTADA cuya fechaFin es anterior a hoy, y solo su organizador. Pasa a ARCHIVADA, guarda su fechaArchivado y sus registros se conservan.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- Registro.asistio arranca en falso y pasa a verdadero una sola vez, solo si la edición está ACEPTADA y ya empezó.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- Evento.visitas arranca en 0 y solo aumenta, de a uno por cada consulta del evento en el sitio.&amp;lt;/span&amp;gt;&amp;lt;/div&amp;gt;&amp;lt;div&amp;gt;&amp;lt;span style=&amp;quot;font-size: 12px;&amp;quot;&amp;gt;- urlV
