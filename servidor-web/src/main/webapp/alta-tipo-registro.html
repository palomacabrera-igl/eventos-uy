<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Alta de tipo de registro</title>
  <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/fuentes.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de tipo de registro</p>
      <h1 class="ev-pagetitle">Crear un tipo de registro</h1>
    </section>

    <div id="solo-organizadores" class="alert alert-warning d-none">
      Solo un organizador con la sesión iniciada puede crear un tipo de registro.
      <a href="login.html">Iniciá sesión</a> para continuar.
    </div>

    <form class="ev-form" id="form-tipo">
      <div class="mb-3"><label class="form-label" for="edicion">Edición</label>
        <select class="form-select" id="edicion" name="edicion" required></select>
      </div>
      <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" type="text" required></div>
      <div class="mb-3"><label class="form-label" for="desc">Descripción</label><textarea class="form-control" id="desc" name="desc" rows="2" required></textarea></div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="costo">Costo</label><input class="form-control" id="costo" name="costo" type="number" min="0" required></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="cupo">Cupo</label><input class="form-control" id="cupo" name="cupo" type="number" min="1" required></div>
      </div>

      <div role="alert" class="alert alert-danger d-none" id="error-tipo"></div>
      <div role="alert" class="alert alert-success d-none" id="exito-tipo"></div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-accent" type="submit">Crear tipo de registro</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch (e) { return null; }
    }
    const rol = leer("demoRol") || "visitante";
    const yo = leer("demoNick");

    const form = document.getElementById("form-tipo");
    const selEdicion = document.getElementById("edicion");
    const error = document.getElementById("error-tipo");
    const exito = document.getElementById("exito-tipo");

    // La letra: el actor es el Organizador, y se listan las ediciones que
    // organiza el usuario EN CUALQUIER ESTADO.
    if (rol !== "organizador") {
      form.hidden = true;
      document.getElementById("solo-organizadores").classList.remove("d-none");
    } else {
      const mias = datos.ediciones.filter(function (e) { return e.organizadorNickname === yo; });
      if (mias.length === 0) {
        selEdicion.innerHTML = '<option value="">Todavía no creaste ninguna edición</option>';
      } else {
        selEdicion.innerHTML = '<option value="">Elegí una edición</option>' +
          mias.map(function (e) {
            return '<option value="' + e.id + '">' + e.nombre + " (" + e.estado + ")</option>";
          }).join("");
      }
    }

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      error.classList.add("d-none");
      exito.classList.add("d-none");

      const campoNombre = document.getElementById("nombre");
      const nombre = campoNombre.value.trim();
      const edicion = datos.ediciones.find(function (e) { return e.id === selEdicion.value; });

      // La letra: el nombre no se puede repetir DENTRO DE ESA EDICION.
      // En otra edicion el mismo nombre es valido: hay dos "General" en los datos.
      const repetido = datos.tiposRegistro.some(function (t) {
        return t.edicionId === edicion.id && t.nombre.toLowerCase() === nombre.toLowerCase();
      });
      if (repetido) {
        error.textContent = '"' + nombre + '" ya es un tipo de registro de ' + edicion.nombre + ".";
        error.classList.remove("d-none");
        campoNombre.focus();
        return;
      }

      const costo = Number(document.getElementById("costo").value);
      const cupo = Number(document.getElementById("cupo").value);
      exito.textContent = 'Tipo de registro "' + nombre + '" creado para ' + edicion.nombre +
                          ": $ " + costo + ", " + cupo + " cupos.";
      exito.classList.remove("d-none");
    });
  </script>
</body>
</html>
