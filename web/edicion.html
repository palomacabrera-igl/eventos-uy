<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Edición</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <a class="ev-back" id="volver-evento" href="evento.html">&larr; Volver</a>
    </section>

    <div id="no-encontrada" class="alert alert-warning d-none">
      No encontramos esa edición. Volvé a la <a href="index.html">página principal</a>.
    </div>

    <div id="no-disponible" class="alert alert-warning d-none">
      Esta edición todavía no está publicada. Solo puede verla su organizador.
    </div>

    <div id="contenido">

    <div id="detalle" class="row g-4">
      <div class="col-12 col-lg-5">
        <img id="imagen" class="img-fluid rounded" alt="">
      </div>
      <div class="col-12 col-lg-7">
        <p class="ev-kicker">Edición</p>
        <h1 class="ev-pagetitle mb-2" id="titulo"></h1>
        <p class="mb-3"><span class="ev-estado" id="estado"></span></p>
        <dl class="ev-detail">
          <dt>Ciudad</dt><dd id="ciudad"></dd>
          <dt>País</dt><dd id="pais"></dd>
          <dt>Sigla</dt><dd id="sigla"></dd>
          <dt>Inicio</dt><dd id="inicio"></dd>
          <dt>Fin</dt><dd id="fin"></dd>
          <dt>Alta</dt><dd id="alta"></dd>
          <dt>Organizador</dt><dd id="organizador"></dd>
        </dl>
        <div class="d-flex gap-2 mt-3">
          <a class="btn btn-accent" id="btn-registrarme" href="registro-edicion.html">Registrarme</a>
          <a class="btn btn-outline-secondary" id="btn-registros" href="consulta-registro.html">Ver registros</a>
        </div>
      </div>
    </div>

    <div class="ev-section">Tipos de registro</div>
    <div id="lista-tipos"></div>
    <a class="ev-back d-inline-block mt-2" id="btn-alta-tipo" href="alta-tipo-registro.html">+ Agregar tipo de registro</a>

    <div class="ev-section">Patrocinios</div>
    <div id="lista-patrocinios"></div>
    <a class="ev-back d-inline-block mt-2" id="btn-alta-patrocinio" href="alta-patrocinio.html">+ Agregar patrocinio</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>

  <script src="js/datos.js"></script>
  <script>
    // ----- Quien esta mirando -----
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch (e) { return null; }
    }
    const rol = leer("demoRol") || "visitante";
    const yo = leer("demoNick");

    function esMiEdicion(edicion) {
      return rol === "organizador" && edicion.organizadorNickname === yo;
    }

    function verSi(id, condicion) {
      document.getElementById(id).hidden = !condicion;
    }

    // Pasa "2026-10-01" a "01/10/2026".
    function fecha(iso) {
      const partes = iso.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function mostrar(edicion) {
      const evento = datos.eventos.find(function (e) { return e.id === edicion.eventoId; });
      const organizador = datos.usuarios.find(function (u) {
        return u.nickname === edicion.organizadorNickname;
      });

      document.title = "eventos.uy — " + edicion.nombre;

      const volver = document.getElementById("volver-evento");
      volver.textContent = "\u2190 " + evento.nombre;
      volver.href = "evento.html?id=" + evento.id;

      document.getElementById("titulo").textContent = edicion.nombre;

      const estado = document.getElementById("estado");
      estado.textContent = edicion.estado;
      estado.classList.add("ev-estado--" + edicion.estado);

      const img = document.getElementById("imagen");
      if (edicion.imagen) {
        img.src = edicion.imagen;
        img.alt = "Imagen de la edición " + edicion.nombre;
      } else {
        img.hidden = true;
      }

      document.getElementById("ciudad").textContent = edicion.ciudad;
      document.getElementById("pais").textContent = edicion.pais;
      document.getElementById("sigla").textContent = edicion.sigla;
      document.getElementById("inicio").textContent = fecha(edicion.fechaInicio);
      document.getElementById("fin").textContent = fecha(edicion.fechaFin);
      document.getElementById("alta").textContent = fecha(edicion.fechaAlta);
      document.getElementById("organizador").innerHTML =
              '<a href="perfil.html?nickname=' + organizador.nickname + '">' + organizador.nombre + '</a>';

      const tipos = datos.tiposRegistro.filter(function (t) {
        return t.edicionId === edicion.id;
      });
      const cajaTipos = document.getElementById("lista-tipos");
      if (tipos.length === 0) {
        cajaTipos.innerHTML = '<p class="text-secondary">Esta edición todavía no tiene tipos de registro.</p>';
      } else {
        cajaTipos.innerHTML = tipos.map(function (t) {
          const libres = t.cupo - t.cuposOcupados;
          return '<a class="ev-row" href="tipo-registro.html?id=' + t.id + '">' +
                  '<span class="ev-rowname">' + t.nombre + '</span>' +
                  '<span class="ev-rowmeta">$ ' + t.costo + ' · ' +
                  libres + ' de ' + t.cupo + ' cupos libres</span>' +
                  '</a>';
        }).join("");
      }

      const patrocinios = datos.patrocinios.filter(function (p) {
        return p.edicionId === edicion.id;
      });
      const cajaPatro = document.getElementById("lista-patrocinios");
      if (patrocinios.length === 0) {
        cajaPatro.innerHTML = '<p class="text-secondary">Esta edición todavía no tiene patrocinios.</p>';
      } else {
        cajaPatro.innerHTML = patrocinios.map(function (p) {
          const institucion = datos.instituciones.find(function (i) {
            return i.id === p.institucionId;
          });
          return '<a class="ev-row" href="patrocinio.html?id=' + p.id + '">' +
                  '<span class="ev-rowname">' + institucion.nombre + '</span>' +
                  '<span class="ev-rowmeta">' + p.nivel + '</span>' +
                  '</a>';
        }).join("");
      }
    }

    // ----- Que acciones corresponden a quien mira -----
    function aplicarRol(edicion) {
      const mia = esMiEdicion(edicion);

      verSi("btn-registros", mia);
      verSi("btn-alta-tipo", mia);
      verSi("btn-alta-patrocinio", mia);

      const btn = document.getElementById("btn-registrarme");
      const miRegistro = datos.registros.find(function (r) {
        return r.edicionId === edicion.id && r.asistenteNickname === yo;
      });

      if (rol !== "asistente" || edicion.estado !== "aceptada") {
        btn.hidden = true;
      } else if (miRegistro) {
        btn.textContent = "Ver mi registro";
        btn.className = "btn btn-outline-secondary";
        btn.href = "consulta-registro.html?id=" + miRegistro.id;
      } else {
        btn.href = "registro-edicion.html?edicion=" + edicion.id;
      }
    }

    // ----- Que edicion hay que mostrar, y puede verla quien mira? -----
    const params = new URLSearchParams(location.search);
    const idPedido = params.get("id") || "2";
    const edicion = datos.ediciones.find(function (e) { return e.id === idPedido; });

    if (!edicion) {
      document.getElementById("contenido").hidden = true;
      document.getElementById("no-encontrada").classList.remove("d-none");
    } else if (edicion.estado !== "aceptada" && !esMiEdicion(edicion)) {
      document.getElementById("contenido").hidden = true;
      document.getElementById("no-disponible").classList.remove("d-none");
    } else {
      mostrar(edicion);
      aplicarRol(edicion);
    }
  </script>
</body>
</html>
