<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Registro a edición</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <a class="ev-back" href="edicion.html">&larr; Maratón de Montevideo 2022</a>
      <p class="ev-kicker mt-2">Registro a edición</p>
      <h1 class="ev-pagetitle">Registrarme a la edición</h1>
    </section>

    <form class="ev-form" onsubmit="return false">
      <div class="mb-3"><label class="form-label" for="evento">Evento</label>
        <select class="form-select" id="evento"><option>Maratón de Montevideo</option></select>
      </div>
      <div class="mb-3"><label class="form-label" for="edicion">Edición</label>
        <select class="form-select" id="edicion"><option>Maratón de Montevideo 2022</option></select>
      </div>
      <div class="mb-3"><label class="form-label" for="tipo">Tipo de registro</label>
        <select class="form-select" id="tipo">
          <option>Corredor 10K — $ 1.200</option><option>Corredor 21K — $ 1.800</option><option>Corredor 42K — $ 2.400</option>
        </select>
      </div>

      <label class="form-label d-block">Tipo de inscripción</label>
      <div class="mb-3 d-flex gap-4">
        <div class="form-check"><input class="form-check-input" type="radio" name="modo" id="mGeneral" value="general" checked><label class="form-check-label" for="mGeneral">General</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="modo" id="mCodigo" value="codigo"><label class="form-check-label" for="mCodigo">Con código de patrocinio</label></div>
      </div>

      <div class="mb-3" id="boxCodigo" hidden>
        <label class="form-label" for="codigo">Código de patrocinio</label>
        <input class="form-control" id="codigo" type="text" placeholder="Ej: 4821">
        <p class="form-text">Con un código válido de tu institución, el costo es $ 0.</p>
      </div>

      <p class="form-text">Un asistente sin institución solo puede registrarse de forma general.</p>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-accent" type="submit">Confirmar registro</button>
        <a class="btn btn-outline-secondary" href="edicion.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    const box = document.getElementById("boxCodigo");
    document.querySelectorAll('input[name="modo"]').forEach((r) =>
      r.addEventListener("change", () => { box.hidden = !document.getElementById("mCodigo").checked; })
    );
  </script>
</body>
</html>
