<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Inicio de sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Inicio de sesión</p>
      <h1 class="ev-pagetitle">Ingresá a eventos.uy</h1>
    </section>

    <!-- Parte 1: el formulario no envía; es solo navegación con datos fijos. -->
    <form class="ev-form" onsubmit="return false">
      <div class="mb-3">
        <label class="form-label" for="usuario">Nickname o correo electrónico</label>
        <input class="form-control" id="usuario" type="text" placeholder="vale23">
      </div>
      <div class="mb-3">
        <label class="form-label" for="pass">Contraseña</label>
        <input class="form-control" id="pass" type="password" placeholder="••••••••">
      </div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-accent" type="submit">Ingresar</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
      <p class="form-text mt-3">¿No tenés cuenta? <a href="alta-usuario.html">Registrate</a>.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
</body>
</html>
