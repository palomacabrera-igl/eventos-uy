<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>

  <div id="cabezal"></div>

  <main class="container pt-4">

    <ul class="nav ev-tabs mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="tab-eventos" type="button">Eventos</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-usuarios" type="button">Usuarios</button></li>
    </ul>

    <p class="ev-fnote" id="fnote" hidden></p>
    <div class="row g-3" id="board"></div>
    <div id="usersPanel" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    const EVENTOS = [
      { n: "Montevideo Rock",           cat: "Música",     lugar: "Antel Arena",               fecha: "14 nov 2026", tono: "ink" },
      { n: "Maratón de Montevideo",     cat: "Deporte",    lugar: "Rambla de Montevideo",      fecha: "21 set 2026", tono: "ink" },
      { n: "Montevideo Comics",         cat: "Cultura",    lugar: "LATU",                      fecha: "3 oct 2026",  tono: "paper" },
      { n: "DevFest Montevideo",        cat: "Tecnología", lugar: "UTEC",                      fecha: "21 jun 2026", tono: "ink" },
      { n: "Expo Negocios UY",          cat: "Negocios",   lugar: "Radisson",                  fecha: "9 may 2026",  tono: "paper" },
      { n: "Noche de la Nostalgia",     cat: "Música",     lugar: "Varios locales",            fecha: "24 ago 2026", tono: "ink" },
      { n: "Punta Tech Meetup",         cat: "Tecnología", lugar: "Punta del Este",            fecha: "15 feb 2026", tono: "paper" },
      { n: "Hackathon ANII",            cat: "Tecnología", lugar: "LATU",                      fecha: "3 abr 2026",  tono: "ink" },
      { n: "Feria del Libro",           cat: "Cultura",    lugar: "Intendencia de Montevideo", fecha: "2 oct 2026",  tono: "paper" },
      { n: "Noche de los Museos",       cat: "Cultura",    lugar: "Ciudad Vieja",              fecha: "11 dic 2026", tono: "ink" },
      { n: "Clásico del fútbol",        cat: "Deporte",    lugar: "Estadio Centenario",        fecha: "5 jul 2026",  tono: "paper" },
      { n: "Torneo de Verano",          cat: "Deporte",    lugar: "Maldonado",                 fecha: "10 ene 2026", tono: "ink" },
      { n: "Cosquín Rock Uruguay",      cat: "Música",     lugar: "Parque Roosevelt",          fecha: "7 mar 2026",  tono: "paper" },
      { n: "Punta del Este Convention", cat: "Negocios",   lugar: "Punta del Este",            fecha: "18 set 2026", tono: "paper" },
      { n: "Foro de Emprendedores ANDE",cat: "Negocios",   lugar: "LATU",                      fecha: "26 jun 2026", tono: "ink" },
    ];
    const USUARIOS = [
      { nick: "vale23", nombre: "Valentina Díaz",            rol: "Asistente" },
      { nick: "imm",    nombre: "Intendencia de Montevideo", rol: "Organizador" },
      { nick: "jperez", nombre: "Juan Pérez",                rol: "Asistente" },
      { nick: "antel",  nombre: "ANTEL",                     rol: "Organizador" },
    ];
    const ini = (t) => (t.trim()[0] || "?").toUpperCase();
    let catOn = null;
    try { catOn = new URLSearchParams(location.search).get("cat"); } catch (e) {}

    const board = document.getElementById("board");
    const fnote = document.getElementById("fnote");
    const usersPanel = document.getElementById("usersPanel");

    function renderBoard() {
      const lista = catOn ? EVENTOS.filter((e) => e.cat === catOn) : EVENTOS;
      if (catOn) { fnote.hidden = false; fnote.innerHTML = lista.length + " evento(s) en <b>" + catOn + "</b>"; }
      else { fnote.hidden = true; }
      board.innerHTML = lista.map((e, i) => {
        const feat = !catOn && i === 0;
        const tono = feat ? "accent" : e.tono;
        const col = feat ? "col-12 col-lg-8" : "col-12 col-sm-6 col-lg-4";
        return '<div class="' + col + " ev-card-wrap" + (feat ? " featured" : "") + '">' +
          '<article class="ev-card">' +
            '<div class="ev-poster ev-poster--' + tono + '">' +
              '<div class="ev-poster-top"><span>' + e.cat + "</span><span>" + (feat ? "Destacado" : e.fecha) + "</span></div>" +
              '<div class="ev-poster-title">' + e.n + "</div></div>" +
            '<div class="ev-cardbody">' +
              '<div class="ev-meta"><b>' + e.lugar + "</b><br>" + e.fecha + "</div>" +
              '<a class="btn btn-outline-secondary btn-sm" href="evento.html">Ver evento</a></div>' +
          "</article></div>";
      }).join("");
    }
    function renderUsers() {
      usersPanel.innerHTML = USUARIOS.map((u) =>
        '<a class="ev-user" href="perfil.html">' +
          '<div class="ev-ava">' + ini(u.nombre) + "</div>" +
          "<div><div class=\"ev-uname\">" + u.nombre + "</div><div class=\"ev-uhandle\">@" + u.nick + "</div></div>" +
          '<span class="ev-utag">' + u.rol + "</span></a>"
      ).join("");
    }
    function verTab(cual) {
      const ev = cual === "eventos";
      document.getElementById("tab-eventos").classList.toggle("active", ev);
      document.getElementById("tab-usuarios").classList.toggle("active", !ev);
      board.hidden = !ev; fnote.hidden = !ev || !catOn; usersPanel.hidden = ev;
    }
    document.getElementById("tab-eventos").addEventListener("click", () => verTab("eventos"));
    document.getElementById("tab-usuarios").addEventListener("click", () => verTab("usuarios"));

    renderBoard(); renderUsers();
  </script>
</body>
</html>
