<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>

  <div id="cabezal"></div>

  <main class="container pt-4">

    <ul class="nav ev-tabs mb-4" role="tablist">
      <li class="nav-item"><button class="nav-link active" id="tab-eventos" type="button">Eventos</button></li>
      <li class="nav-item"><button class="nav-link" id="tab-usuarios" type="button">Usuarios</button></li>
    </ul>

    <p class="ev-fnote" id="fnote" hidden></p>
    <div class="row g-3" id="board"></div>
    <div id="usersPanel" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- datos.js ANTES de cabezal.js: así el cabezal arma las categorías con las reales -->
  <script src="js/datos.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    // Helpers chicos
    const ini = (t) => (t.trim()[0] || "?").toUpperCase();
    const cap = (t) => t.charAt(0).toUpperCase() + t.slice(1);

    // Nombres de las categorías de un evento (de ids -> nombres)
    function nombresCats(ev) {
      return ev.categoriaIds
        .map((id) => { const c = datos.categorias.find((c) => c.id === id); return c ? c.nombre : null; })
        .filter(Boolean);
    }

    // Categoría activa (viene del cabezal: index.html?cat=Ingeniería)
    let catOn = null;
    try { catOn = new URLSearchParams(location.search).get("cat"); } catch (e) {}

    const board = document.getElementById("board");
    const fnote = document.getElementById("fnote");
    const usersPanel = document.getElementById("usersPanel");

    function renderBoard() {
      // Si hay categoría elegida, filtro los eventos que la tienen
      const lista = catOn
        ? datos.eventos.filter((e) => nombresCats(e).includes(catOn))
        : datos.eventos;

      if (catOn) { fnote.hidden = false; fnote.innerHTML = lista.length + " evento(s) en <b>" + catOn + "</b>"; }
      else { fnote.hidden = true; }

      board.innerHTML = lista.map((e, i) => {
        const feat = !catOn && i === 0;                 // el primero, destacado
        const tono = feat ? "accent" : (i % 2 ? "paper" : "ink");
        const col = feat ? "col-12 col-lg-8" : "col-12 col-sm-6 col-lg-4";
        const cats = nombresCats(e).join(" · ");
        return `<div class="${col} ev-card-wrap${feat ? " featured" : ""}">
          <article class="ev-card">
            <div class="ev-poster ev-poster--${tono}">
              <div class="ev-poster-top"><span>${cats}</span><span>${feat ? "Destacado" : ""}</span></div>
              <div class="ev-poster-title">${e.nombre}</div>
            </div>
            <div class="ev-cardbody">
              <div class="ev-meta"><b>${e.sigla}</b></div>
              <a class="btn btn-outline-secondary btn-sm" href="evento.html?id=${e.id}">Ver evento</a>
            </div>
          </article>
        </div>`;
      }).join("");
    }

    function renderUsers() {
      usersPanel.innerHTML = datos.usuarios.map((u) => {
        const nombre = u.nombre + (u.apellido ? " " + u.apellido : "");
        return `<a class="ev-user" href="perfil.html?nickname=${u.nickname}">
          <div class="ev-ava">${ini(u.nombre)}</div>
          <div><div class="ev-uname">${nombre}</div><div class="ev-uhandle">@${u.nickname}</div></div>
          <span class="ev-utag">${cap(u.rol)}</span>
        </a>`;
      }).join("");
    }

    function verTab(cual) {
      const ev = cual === "eventos";
      document.getElementById("tab-eventos").classList.toggle("active", ev);
      document.getElementById("tab-usuarios").classList.toggle("active", !ev);
      board.hidden = !ev; fnote.hidden = !ev || !catOn; usersPanel.hidden = ev;
    }
    document.getElementById("tab-eventos").addEventListener("click", () => verTab("eventos"));
    document.getElementById("tab-usuarios").addEventListener("click", () => verTab("usuarios"));

    renderBoard(); renderUsers();
  </script>
</body>
</html>
