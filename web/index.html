<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>eventos.uy</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        :root { --azul: #07508c; }

        body { background: #f5f6f7; color: #16344f; }
        .navbar { background: var(--azul); }
        .category-btn.active, .category-btn:hover {
            background: var(--azul);
            color: white;
            border-color: var(--azul);
        }
        .event-card {
            transition: transform .2s, box-shadow .2s;
        }
        .event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 .5rem 1rem rgba(0,0,0,.15);
        }
        .event-image {
            height: 180px;
            object-fit: cover;
            background: #eaf2fb;
        }
    </style>
</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">eventos.uy</a>

        <form class="d-flex ms-lg-auto my-2 my-lg-0" role="search">
            <input id="buscador" class="form-control" type="search"
                   placeholder="Buscar eventos...">
        </form>

        <a class="btn btn-link text-white ms-lg-3 text-decoration-none" href="#">
            Iniciar sesión
        </a>
        <a class="btn btn-light ms-2" href="#">Registrarse</a>
    </div>
</nav>

<main class="container py-5">
    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Eventos</h1>
        </div>
        <a href="#" class="btn btn-outline-primary">Ver usuarios</a>
    </div>

    <section class="mb-4">
        <h2 class="h6 text-secondary">Categorías</h2>
        <div id="categorias" class="d-flex flex-wrap gap-2"></div>
    </section>

    <div id="mensaje" class="alert alert-info d-none"></div>
    <section id="lista-eventos" class="row g-4"></section>
</main>

<script src="js/datos.js"></script>
<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
