<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Evento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <a class="ev-back" href="index.html">&larr; Volver a la cartelera</a>
    </section>

    <div id="no-encontrado" class="alert alert-warning d-none">
      No encontramos ese evento. Volvé a la <a href="index.html">página principal</a>.
    </div>

    <div id="contenido">
      <div class="row g-4">
        <div class="col-12 col-lg-5">
          <div id="portada"></div>
        </div>

        <div class="col-12 col-lg-7">
          <p class="ev-kicker">Evento</p>
          <h1 class="ev-pagetitle mb-3" id="titulo"></h1>
          <p class="ev-sub mb-3" style="color:var(--ev-muted);" id="descripcion"></p>
          <dl class="ev-detail">
            <dt>Sigla</dt><dd id="sigla"></dd>
            <dt>Categorías</dt><dd id="categorias"></dd>
            <dt>Alta</dt><dd id="alta"></dd>
          </dl>
        </div>
      </div>

      <div class="ev-section">Ediciones</div>
      <div id="lista-ediciones"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script src="js/datos.js"></script>
  <script>
    // Pasa "2026-10-01" a "01/10/2026".
    function fecha(iso) {
      const partes = iso.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function nombresDeCategorias(evento) {
      return evento.categoriaIds.map(function (id) {
        const categoria = datos.categorias.find(function (c) { return c.id === id; });
        return categoria.nombre;
      });
    }

    function mostrar(evento) {
      const categorias = nombresDeCategorias(evento);

      document.title = "eventos.uy — " + evento.nombre;
      document.getElementById("titulo").textContent = evento.nombre;
      document.getElementById("descripcion").textContent = evento.descripcion;
      document.getElementById("sigla").textContent = evento.sigla;
      document.getElementById("categorias").textContent = categorias.join(", ");
      document.getElementById("alta").textContent = fecha(evento.fechaAlta);

      // La letra pide "imagen si tiene". Si no tiene, se dibuja el poster de color.
      const portada = document.getElementById("portada");
      if (evento.imagen) {
        portada.innerHTML = '<img class="img-fluid rounded" src="' + evento.imagen +
                            '" alt="Imagen del evento ' + evento.nombre + '">';
      } else {
        portada.innerHTML =
          '<div class="ev-poster ev-poster--ink" style="aspect-ratio:4/3;border-radius:4px;">' +
            '<div class="ev-poster-top"><span>' + categorias.join(" · ") + '</span></div>' +
            '<div class="ev-poster-title" style="font-size:2.4rem;">' + evento.nombre + '</div>' +
          '</div>';
      }

      // La letra: en la consulta de evento se listan las ediciones ACEPTADA.
      const aceptadas = datos.ediciones.filter(function (edicion) {
        return edicion.eventoId === evento.id && edicion.estado === "aceptada";
      });

      const caja = document.getElementById("lista-ediciones");
      if (aceptadas.length === 0) {
        caja.innerHTML = '<p class="text-secondary">Este evento todavía no tiene ediciones publicadas.</p>';
      } else {
        caja.innerHTML = aceptadas.map(function (edicion) {
          return '<a class="ev-row" href="edicion.html?id=' + edicion.id + '">' +
                   '<span>' +
                     '<span class="ev-rowname">' + edicion.nombre + '</span><br>' +
                     '<span class="ev-rowmeta">' + edicion.ciudad + ' · ' +
                       fecha(edicion.fechaInicio) + '</span>' +
                   '</span>' +
                   '<span class="ev-estado ev-estado--aceptada">Aceptada</span>' +
                 '</a>';
        }).join("");
      }
    }

    const params = new URLSearchParams(location.search);
    const idPedido = params.get("id") || "2";
    const evento = datos.eventos.find(function (e) { return e.id === idPedido; });

    if (evento) {
      mostrar(evento);
    } else {
      document.getElementById("contenido").hidden = true;
      document.getElementById("no-encontrado").classList.remove("d-none");
    }
  </script>
</body>
</html>
