<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Patrocinio</title>
  <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/fuentes.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <a class="ev-back" id="volver" href="index.html">&larr; Volver</a>
      <p class="ev-kicker mt-2">Patrocinio</p>
      <div class="d-flex align-items-center gap-3 flex-wrap">
        <div id="logo"></div>
        <h1 class="ev-pagetitle mb-0" id="titulo">Patrocinio</h1>
      </div>
    </section>

    <div id="no-encontrado" class="alert alert-warning d-none">
      No encontramos ese patrocinio. Volvé a la <a href="index.html">página principal</a>.
    </div>

    <div id="no-disponible" class="alert alert-warning d-none">
      Esta edición todavía no está publicada. Solo puede verla su organizador.
    </div>

    <dl class="ev-detail" id="datos"></dl>
  </main>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch (e) { return null; }
    }
    const rol = leer("demoRol") || "visitante";
    const yo = leer("demoNick");

    function fecha(iso) {
      const partes = iso.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function fila(etiqueta, valor) {
      return "<dt>" + etiqueta + "</dt><dd>" + valor + "</dd>";
    }

    function avisar(id) {
      document.getElementById("datos").hidden = true;
      document.getElementById(id).classList.remove("d-none");
    }

    const params = new URLSearchParams(location.search);
    const patrocinio = datos.patrocinios.find(function (p) { return p.id === params.get("id"); });

    if (!patrocinio) {
      avisar("no-encontrado");
    } else {
      const edicion = datos.ediciones.find(function (e) { return e.id === patrocinio.edicionId; });
      const institucion = datos.instituciones.find(function (i) { return i.id === patrocinio.institucionId; });
      const tipo = datos.tiposRegistro.find(function (t) { return t.id === patrocinio.tipoRegistroId; });
      const esMiEdicion = rol === "organizador" && edicion.organizadorNickname === yo;

      if (edicion.estado !== "aceptada" && !esMiEdicion) {
        avisar("no-disponible");
      } else {
        document.title = "eventos.uy — Patrocinio de " + institucion.nombre;
        document.getElementById("titulo").textContent = institucion.nombre;

        // La letra incluye a la institucion entre las entidades con imagen.
        const logo = document.getElementById("logo");
        if (institucion.imagen) {
          logo.innerHTML = '<img src="' + institucion.imagen +
                           '" alt="Imagen de ' + institucion.nombre +
                           '" style="width:56px;height:56px;border-radius:4px;object-fit:cover;">';
        }

        const volver = document.getElementById("volver");
        volver.textContent = "← " + edicion.nombre;
        volver.href = "edicion.html?id=" + edicion.id;

        const nivel = patrocinio.nivel.charAt(0).toUpperCase() + patrocinio.nivel.slice(1);
        const usados = patrocinio.usosActuales;
        const total = patrocinio.cantidadRegistrosGratuitos;

        let html =
          fila("Edición", '<a href="edicion.html?id=' + edicion.id + '">' + edicion.nombre + "</a>") +
          fila("Institución", institucion.nombre) +
          fila("Nivel", nivel) +
          fila("Aporte", "$ " + patrocinio.aporte) +
          fila("Tipo de registro",
               '<a href="tipo-registro.html?id=' + tipo.id + '">' + tipo.nombre + "</a>") +
          fila("Registros gratuitos", total + " (usados " + usados + ")") +
          fila("Fecha de alta", fecha(patrocinio.fechaAlta));

        // La letra: el codigo no se publica en esta consulta. Solo lo ve el
        // organizador de la edicion, al consultar los patrocinios de SUS ediciones.
        if (esMiEdicion) {
          html += fila("Código de patrocinio", "<code>" + patrocinio.codigo + "</code>");
        }

        document.getElementById("datos").innerHTML = html;
      }
    }
  </script>
</body>
</html>
