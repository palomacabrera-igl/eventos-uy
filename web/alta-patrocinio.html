<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Alta de patrocinio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de patrocinio</p>
      <h1 class="ev-pagetitle">Crear un patrocinio</h1>
    </section>

    <form class="ev-form" onsubmit="return false">
      <div class="mb-3"><label class="form-label" for="evento">Evento</label>
        <select class="form-select" id="evento"><option>Maratón de Montevideo</option></select>
      </div>
      <div class="mb-3"><label class="form-label" for="edicion">Edición</label>
        <select class="form-select" id="edicion"><option>Maratón de Montevideo 2022</option></select>
      </div>
      <div class="mb-3"><label class="form-label" for="inst">Institución</label>
        <select class="form-select" id="inst"><option>UTEC</option><option>ANTEL</option><option>Intendencia de Montevideo</option></select>
      </div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="nivel">Nivel de patrocinio</label>
          <select class="form-select" id="nivel"><option>Platino</option><option>Oro</option><option>Plata</option><option>Bronce</option></select>
        </div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="aporte">Aporte económico</label><input class="form-control" id="aporte" type="number" min="0" placeholder="50000"></div>
      </div>
      <div class="mb-3"><label class="form-label" for="tipo">Tipo de registro (gratuito)</label>
        <select class="form-select" id="tipo"><option>Corredor 10K</option><option>Corredor 21K</option><option>Corredor 42K</option></select>
      </div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="cant">Cantidad de registros gratuitos</label><input class="form-control" id="cant" type="number" min="0" placeholder="5"></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="codigo">Código de patrocinio</label><input class="form-control" id="codigo" type="text" placeholder="4821"></div>
      </div>
      <p class="form-text">El costo de los registros gratuitos no puede superar el 20% del aporte.</p>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-accent" type="submit">Crear patrocinio</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
</body>
</html>
