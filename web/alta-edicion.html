<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Alta de edición</title>
  <link href="assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/fuentes.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de edición</p>
      <h1 class="ev-pagetitle">Crear una edición</h1>
    </section>

    <div id="solo-organizadores" class="alert alert-warning d-none">
      Solo un organizador con la sesión iniciada puede crear una edición.
      <a href="login.html">Iniciá sesión</a> para continuar.
    </div>

    <form class="ev-form" id="form-edicion">
      <div class="mb-3"><label class="form-label" for="evento">Evento</label>
        <select class="form-select" id="evento" name="evento" required></select>
      </div>
      <div class="mb-3"><label class="form-label" for="nombre">Nombre de la edición</label><input class="form-control" id="nombre" name="nombre" type="text" required></div>
      <div class="mb-3"><label class="form-label" for="sigla">Sigla</label><input class="form-control" id="sigla" name="sigla" type="text" required></div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="ciudad">Ciudad</label><input class="form-control" id="ciudad" name="ciudad" type="text" required></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="pais">País</label><input class="form-control" id="pais" name="pais" type="text" value="Uruguay" required></div>
      </div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="ini">Fecha de inicio</label><input class="form-control" id="ini" name="ini" type="date" required></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="fin">Fecha de fin</label><input class="form-control" id="fin" name="fin" type="date" required></div>
      </div>
      <div class="mb-3"><label class="form-label" for="imagen">Imagen (opcional)</label><input class="form-control" id="imagen" name="imagen" type="file" accept="image/*"></div>

      <p class="form-text">La edición queda en estado <b>Ingresada</b> hasta que el administrador la acepte o rechace.</p>

      <div role="alert" class="alert alert-danger d-none" id="error-edicion"></div>
      <div role="alert" class="alert alert-success d-none" id="exito-edicion"></div>

      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-accent" type="submit">Crear edición</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch (e) { return null; }
    }
    const rol = leer("demoRol") || "visitante";
    const yo = leer("demoNick");

    const form = document.getElementById("form-edicion");
    const error = document.getElementById("error-edicion");
    const exito = document.getElementById("exito-edicion");
    const campoIni = document.getElementById("ini");
    const campoFin = document.getElementById("fin");

    // La letra: el actor de este caso de uso es el Organizador.
    if (rol !== "organizador") {
      form.hidden = true;
      document.getElementById("solo-organizadores").classList.remove("d-none");
    } else {
      document.getElementById("evento").innerHTML =
        '<option value="">Elegí un evento</option>' +
        datos.eventos.map(function (evento) {
          return '<option value="' + evento.id + '">' + evento.nombre + "</option>";
        }).join("");
    }

    // La fecha de fin no puede ser anterior a la de inicio: se lo decimos al
    // navegador para que ni siquiera deje elegirla en el calendario.
    campoIni.addEventListener("change", function () {
      campoFin.min = campoIni.value;
      if (campoFin.value && campoFin.value < campoIni.value) { campoFin.value = ""; }
    });

    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      error.classList.add("d-none");
      exito.classList.add("d-none");

      const campoNombre = document.getElementById("nombre");
      const nombre = campoNombre.value.trim();
      const evento = datos.eventos.find(function (e) {
        return e.id === document.getElementById("evento").value;
      });

      // La letra: el nombre de la edicion es unico en la plataforma.
      const enUso = datos.ediciones.some(function (e) {
        return e.nombre.toLowerCase() === nombre.toLowerCase();
      });
      if (enUso) {
        error.textContent = 'Ya existe una edición con el nombre "' + nombre + '".';
        error.classList.remove("d-none");
        campoNombre.focus();
        return;
      }

      if (campoFin.value < campoIni.value) {
        error.textContent = "La fecha de fin no puede ser anterior a la de inicio.";
        error.classList.remove("d-none");
        campoFin.focus();
        return;
      }

      const hoy = new Date().toLocaleDateString("es-UY");
      exito.textContent = 'Edición "' + nombre + '" de ' + evento.nombre +
                          " creada el " + hoy + ", en estado Ingresada, a nombre de " + yo + ".";
      exito.classList.remove("d-none");
    });
  </script>
</body>
</html>
