<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Consulta de registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <a class="ev-back" id="volver" href="perfil.html">&larr; Mi perfil</a>
      <p class="ev-kicker mt-2">Consulta de registro</p>
      <h1 class="ev-pagetitle" id="titulo">Registros</h1>
    </section>

    <div id="sin-permiso" class="alert alert-warning d-none">
      Esta consulta es para asistentes y organizadores.
      <a href="login.html">Iniciá sesión</a> para ver tus registros.
    </div>

    <div id="no-encontrado" class="alert alert-warning d-none">
      No encontramos ese registro, o no te corresponde verlo.
      Volvé a <a href="perfil.html">tu perfil</a>.
    </div>

    <div id="contenido">
      <p class="ev-sub mb-3" id="bajada"></p>
      <div id="lista"></div>
      <dl class="ev-detail" id="detalle"></dl>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/datos.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    function leer(clave) {
      try { return localStorage.getItem(clave); } catch (e) { return null; }
    }
    const rol = leer("demoRol") || "visitante";
    const yo = leer("demoNick");

    function fecha(iso) {
      const partes = iso.split("-");
      return partes[2] + "/" + partes[1] + "/" + partes[0];
    }

    function fila(etiqueta, valor) {
      return "<dt>" + etiqueta + "</dt><dd>" + valor + "</dd>";
    }

    function avisar(id) {
      document.getElementById("contenido").hidden = true;
      document.getElementById(id).classList.remove("d-none");
    }

    const lista = document.getElementById("lista");
    const detalle = document.getElementById("detalle");
    const bajada = document.getElementById("bajada");
    const titulo = document.getElementById("titulo");
    const volver = document.getElementById("volver");

    // ---------- Pantalla 1a: el asistente ve las ediciones a las que se registro ----------
    function misRegistros() {
      titulo.textContent = "Mis registros";
      bajada.textContent = "Ediciones a las que te registraste.";

      const mios = datos.registros.filter(function (r) { return r.asistenteNickname === yo; });
      if (mios.length === 0) {
        lista.innerHTML = '<p class="text-secondary">Todavía no te registraste a ninguna edición.</p>';
        return;
      }
      lista.innerHTML = mios.map(function (r) {
        const edicion = datos.ediciones.find(function (e) { return e.id === r.edicionId; });
        const tipo = datos.tiposRegistro.find(function (t) { return t.id === r.tipoRegistroId; });
        return '<a class="ev-row" href="consulta-registro.html?id=' + r.id + '">' +
                 '<span>' +
                   '<span class="ev-rowname">' + edicion.nombre + '</span><br>' +
                   '<span class="ev-rowmeta">' + tipo.nombre + '</span>' +
                 '</span>' +
                 '<span class="ev-rowmeta">' + fecha(r.fechaRegistro) + '</span>' +
               '</a>';
      }).join("");
    }

    // ---------- Pantalla 1b: el organizador ve las ediciones que organiza ----------
    function misEdiciones() {
      titulo.textContent = "Registros de mis ediciones";
      bajada.textContent = "Elegí una edición para ver quiénes se registraron.";

      const mias = datos.ediciones.filter(function (e) { return e.organizadorNickname === yo; });
      if (mias.length === 0) {
        lista.innerHTML = '<p class="text-secondary">Todavía no creaste ninguna edición.</p>';
        return;
      }
      lista.innerHTML = mias.map(function (e) {
        const cuantos = datos.registros.filter(function (r) { return r.edicionId === e.id; }).length;
        const texto = cuantos === 1 ? "1 asistente registrado" : cuantos + " asistentes registrados";
        return '<a class="ev-row" href="consulta-registro.html?edicion=' + e.id + '">' +
                 '<span>' +
                   '<span class="ev-rowname">' + e.nombre + '</span><br>' +
                   '<span class="ev-rowmeta">' + e.ciudad + '</span>' +
                 '</span>' +
                 '<span class="ev-rowmeta">' + texto + '</span>' +
               '</a>';
      }).join("");
    }

    // ---------- Pantalla 2: los asistentes registrados en una edicion del organizador ----------
    function asistentesDe(edicion) {
      titulo.textContent = edicion.nombre;
      bajada.textContent = "Asistentes registrados en esta edición.";
      volver.textContent = "← Registros de mis ediciones";
      volver.href = "consulta-registro.html";

      const registros = datos.registros.filter(function (r) { return r.edicionId === edicion.id; });
      if (registros.length === 0) {
        lista.innerHTML = '<p class="text-secondary">Todavía no se registró nadie en esta edición.</p>';
        return;
      }
      lista.innerHTML = registros.map(function (r) {
        const asistente = datos.usuarios.find(function (u) { return u.nickname === r.asistenteNickname; });
        const tipo = datos.tiposRegistro.find(function (t) { return t.id === r.tipoRegistroId; });
        return '<a class="ev-row" href="consulta-registro.html?id=' + r.id + '">' +
                 '<span>' +
                   '<span class="ev-rowname">' + asistente.nombre +
                     (asistente.apellido ? " " + asistente.apellido : "") + '</span><br>' +
                   '<span class="ev-rowmeta">@' + asistente.nickname + ' · ' + tipo.nombre + '</span>' +
                 '</span>' +
                 '<span class="ev-rowmeta">' + fecha(r.fechaRegistro) + '</span>' +
               '</a>';
      }).join("");
    }

    // ---------- Pantalla 3: el detalle de un registro ----------
    function detalleDe(registro) {
      const edicion = datos.ediciones.find(function (e) { return e.id === registro.edicionId; });
      const tipo = datos.tiposRegistro.find(function (t) { return t.id === registro.tipoRegistroId; });
      const asistente = datos.usuarios.find(function (u) { return u.nickname === registro.asistenteNickname; });
      const esMio = registro.asistenteNickname === yo;

      titulo.textContent = "Detalle del registro";
      document.title = "eventos.uy — Registro en " + edicion.nombre;

      if (esMio) {
        volver.textContent = "← Mis registros";
        volver.href = "consulta-registro.html";
      } else {
        volver.textContent = "← " + edicion.nombre;
        volver.href = "consulta-registro.html?edicion=" + edicion.id;
      }

      // La letra: fecha de registro, tipo de registro, costo y si uso codigo.
      let html =
        fila("Edición", '<a href="edicion.html?id=' + edicion.id + '">' + edicion.nombre + "</a>") +
        fila("Asistente", asistente.nombre + (asistente.apellido ? " " + asistente.apellido : "") +
                          " (@" + asistente.nickname + ")") +
        fila("Fecha de registro", fecha(registro.fechaRegistro)) +
        fila("Tipo de registro",
             '<a href="tipo-registro.html?id=' + tipo.id + '">' + tipo.nombre + "</a>") +
        fila("Costo", registro.costo === 0 ? "sin cargo" : "$ " + registro.costo);

      if (registro.patrocinioId) {
        const patrocinio = datos.patrocinios.find(function (p) {
          return p.id === String(registro.patrocinioId);
        });
        const institucion = datos.instituciones.find(function (i) { return i.id === patrocinio.institucionId; });
        html += fila("Código de patrocinio",
                     "Sí, de " + institucion.nombre +
                     ' (<a href="patrocinio.html?id=' + patrocinio.id + '">ver patrocinio</a>)');
      } else {
        html += fila("Código de patrocinio", "No utilizó");
      }

      detalle.innerHTML = html;
    }

    // ---------- Que pantalla corresponde ----------
    const params = new URLSearchParams(location.search);
    const idRegistro = params.get("id");
    const idEdicion = params.get("edicion");

    if (rol !== "asistente" && rol !== "organizador") {
      avisar("sin-permiso");
    } else if (idRegistro) {
      const registro = datos.registros.find(function (r) { return r.id === idRegistro; });
      const edicion = registro
        ? datos.ediciones.find(function (e) { return e.id === registro.edicionId; })
        : null;
      // Un registro lo ve su asistente, o el organizador de esa edicion. Nadie mas.
      const puedo = registro &&
        (registro.asistenteNickname === yo || edicion.organizadorNickname === yo);
      if (!puedo) { avisar("no-encontrado"); } else { detalleDe(registro); }
    } else if (idEdicion) {
      const edicion = datos.ediciones.find(function (e) { return e.id === idEdicion; });
      if (!edicion || edicion.organizadorNickname !== yo) {
        avisar("no-encontrado");
      } else {
        asistentesDe(edicion);
      }
    } else if (rol === "asistente") {
      misRegistros();
    } else {
      misEdiciones();
    }
  </script>
</body>
</html>
