<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Alta de tipo de registro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de tipo de registro</p>
      <h1 class="ev-pagetitle">Crear un tipo de registro</h1>
    </section>

    <form class="ev-form" onsubmit="return false">
      <div class="mb-3"><label class="form-label" for="edicion">Edición</label>
        <select class="form-select" id="edicion" name="edicion">
          <option>Maratón de Montevideo 2025</option><option>Maratón de Montevideo 2022</option>
        </select>
      </div>
      <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" type="text" placeholder="Corredor 10K"></div>
      <div class="mb-3"><label class="form-label" for="desc">Descripción</label><textarea class="form-control" id="desc" name="desc" rows="2"></textarea></div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="costo">Costo</label><input class="form-control" id="costo" name="costo" type="number" min="0" placeholder="1200"></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="cupo">Cupo</label><input class="form-control" id="cupo" name="cupo" type="number" min="0" placeholder="500"></div>
      </div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-accent" type="submit">Crear tipo de registro</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
</body>
</html>
