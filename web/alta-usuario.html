<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Registrarse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de usuario</p>
      <h1 class="ev-pagetitle">Creá tu cuenta</h1>
    </section>

    <form class="ev-form" id="form-alta">
      <fieldset class="mb-3">
        <legend class="form-label d-block">Me registro como</legend>
        <div class="d-flex gap-4">
          <div class="form-check"><input class="form-check-input" type="radio" name="tipo" id="tAsis" value="asistente" checked><label class="form-check-label" for="tAsis">Asistente</label></div>
          <div class="form-check"><input class="form-check-input" type="radio" name="tipo" id="tOrg" value="organizador"><label class="form-check-label" for="tOrg">Organizador</label></div>
        </div>
      </fieldset>

      <div class="mb-3"><label class="form-label" for="nick">Nickname</label><input class="form-control" id="nick" name="nick" type="text" required></div>
      <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" name="nombre" type="text" required></div>
      <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" id="correo" name="correo" type="email" required></div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="pass">Contraseña</label><input class="form-control" id="pass" name="pass" type="password" required></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="pass2">Confirmar contraseña</label><input class="form-control" id="pass2" name="pass2" type="password" required></div>
      </div>
      <div class="mb-3"><label class="form-label" for="imagen">Imagen (opcional)</label><input class="form-control" id="imagen" name="imagen" type="file" accept="image/*"></div>

      <!-- Campos propios del ASISTENTE -->
      <fieldset id="campos-asistente">
        <div class="ev-section">Datos de asistente</div>
        <div class="mb-3"><label class="form-label" for="apellido">Apellido</label><input class="form-control" id="apellido" name="apellido" type="text" required></div>
        <div class="mb-3"><label class="form-label" for="fnac">Fecha de nacimiento</label><input class="form-control" id="fnac" name="fnac" type="date" required></div>
        <div class="mb-3"><label class="form-label" for="inst">Institución (opcional)</label>
          <select class="form-select" id="inst" name="inst">
            <option value="">Sin institución</option>
          </select>
        </div>
      </fieldset>

      <!-- Campos propios del ORGANIZADOR -->
      <fieldset id="campos-organizador" hidden disabled>
        <div class="ev-section">Datos de organizador</div>
        <div class="mb-3"><label class="form-label" for="desc">Descripción</label><textarea class="form-control" id="desc" name="desc" rows="2" required></textarea></div>
        <div class="mb-3"><label class="form-label" for="web">Sitio web (opcional)</label><input class="form-control" id="web" name="web" type="url" placeholder="https://"></div>
      </fieldset>

      <div class="alert alert-danger d-none" id="error-alta"></div>
      <div class="alert alert-success d-none" id="exito-alta"></div>
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-accent" type="submit">Crear cuenta</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
    <script src="js/datos.js"></script>
  <script>
    // Carga las instituciones existentes en el combo (DOM: createElement + appendChild).
    const combo = document.getElementById("inst");
    datos.instituciones.forEach(function (institucion) {
      const opcion = document.createElement("option");
      opcion.value = institucion.id;
      opcion.textContent = institucion.nombre;
      combo.appendChild(opcion);
    });

    // Muestra y habilita los campos del tipo elegido; apaga los del otro.
    const fa = document.getElementById("campos-asistente");
    const fo = document.getElementById("campos-organizador");
    document.querySelectorAll('input[name="tipo"]').forEach(function (radio) {
      radio.addEventListener("change", function () {
        const org = document.getElementById("tOrg").checked;
        fa.hidden = org;
        fa.disabled = org;
        fo.hidden = !org;
        fo.disabled = !org;
      });
    });
    // ----- Validacion al enviar (caso de uso 3) -----
    const form = document.getElementById("form-alta");
    const error = document.getElementById("error-alta");
    const exito = document.getElementById("exito-alta");

    function mostrarError(texto) {
      error.textContent = texto;
      error.classList.remove("d-none");
    }

    form.addEventListener("submit", function (evento) {
      evento.preventDefault();

      error.classList.add("d-none");
      exito.classList.add("d-none");

      const nick = document.getElementById("nick").value.trim();
      const correo = document.getElementById("correo").value.trim();
      const pass = document.getElementById("pass").value;
      const pass2 = document.getElementById("pass2").value;

      const nickEnUso = datos.usuarios.some(function (u) {
        return u.nickname.toLowerCase() === nick.toLowerCase();
      });
      if (nickEnUso) {
        mostrarError('Ya existe un usuario con el nickname "' + nick + '".');
        return;
      }

      const correoEnUso = datos.usuarios.some(function (u) {
        return (u.correo || "").toLowerCase() === correo.toLowerCase();
      });
      if (correoEnUso) {
        mostrarError('Ya existe un usuario con el correo "' + correo + '".');
        return;
      }

      if (pass !== pass2) {
        mostrarError("La contraseña y su confirmación no coinciden.");
        return;
      }

      const hoy = new Date().toLocaleDateString("es-UY");
      exito.textContent = "Usuario " + nick + " creado con éxito el " + hoy +
              ". Ya podés iniciar sesión.";
      exito.classList.remove("d-none");
    });
  </script>
</body>
</html>
