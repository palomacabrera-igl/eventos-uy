<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>eventos.uy — Registrarse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/css/custom.css" rel="stylesheet">
</head>
<body>
  <div id="cabezal"></div>

  <main class="container">
    <section class="ev-pagehead">
      <p class="ev-kicker">Alta de usuario</p>
      <h1 class="ev-pagetitle">Creá tu cuenta</h1>
    </section>

    <form class="ev-form" onsubmit="return false">
      <label class="form-label d-block">Me registro como</label>
      <div class="mb-3 d-flex gap-4">
        <div class="form-check"><input class="form-check-input" type="radio" name="tipo" id="tAsis" value="asistente" checked><label class="form-check-label" for="tAsis">Asistente</label></div>
        <div class="form-check"><input class="form-check-input" type="radio" name="tipo" id="tOrg" value="organizador"><label class="form-check-label" for="tOrg">Organizador</label></div>
      </div>

      <div class="mb-3"><label class="form-label" for="nick">Nickname</label><input class="form-control" id="nick" type="text"></div>
      <div class="mb-3"><label class="form-label" for="nombre">Nombre</label><input class="form-control" id="nombre" type="text"></div>
      <div class="mb-3"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" id="correo" type="email"></div>
      <div class="row g-3">
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="pass">Contraseña</label><input class="form-control" id="pass" type="password"></div>
        <div class="col-12 col-sm-6 mb-3"><label class="form-label" for="pass2">Confirmar contraseña</label><input class="form-control" id="pass2" type="password"></div>
      </div>
      <div class="mb-3"><label class="form-label" for="imagen">Imagen (opcional)</label><input class="form-control" id="imagen" type="file" accept="image/*"></div>

      <!-- Campos propios del ASISTENTE -->
      <fieldset id="campos-asistente">
        <div class="ev-section">Datos de asistente</div>
        <div class="mb-3"><label class="form-label" for="apellido">Apellido</label><input class="form-control" id="apellido" type="text"></div>
        <div class="mb-3"><label class="form-label" for="fnac">Fecha de nacimiento</label><input class="form-control" id="fnac" type="date"></div>
        <div class="mb-3"><label class="form-label" for="inst">Institución (opcional)</label>
          <select class="form-select" id="inst">
            <option value="">Sin institución</option>
            <option>UTEC</option><option>ANTEL</option><option>Intendencia de Montevideo</option>
          </select>
        </div>
      </fieldset>

      <!-- Campos propios del ORGANIZADOR -->
      <fieldset id="campos-organizador" hidden>
        <div class="ev-section">Datos de organizador</div>
        <div class="mb-3"><label class="form-label" for="desc">Descripción</label><textarea class="form-control" id="desc" rows="2"></textarea></div>
        <div class="mb-3"><label class="form-label" for="web">Sitio web (opcional)</label><input class="form-control" id="web" type="url" placeholder="https://"></div>
      </fieldset>

      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-accent" type="submit">Crear cuenta</button>
        <a class="btn btn-outline-secondary" href="index.html">Cancelar</a>
      </div>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/cabezal.js"></script>
  <script>
    // Muestra/oculta los campos según el tipo elegido (solo UI, Parte 1).
    const fa = document.getElementById("campos-asistente");
    const fo = document.getElementById("campos-organizador");
    document.querySelectorAll('input[name="tipo"]').forEach((r) =>
      r.addEventListener("change", () => {
        const org = document.getElementById("tOrg").checked;
        fa.hidden = org; fo.hidden = !org;
      })
    );
  </script>
</body>
</html>
