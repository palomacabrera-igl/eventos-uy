# Configuracion del Servidor Central de eventos.uy.
#
# Este archivo vive en ~/.eventosUy/central.properties (en Windows,
# C:\Users\<usuario>\.eventosUy\central.properties). Si no existe, el Servidor
# Central lo crea con estos valores la primera vez que arranca.
#
# Para cambiar algo se edita el archivo y se reinicia el programa: no hace falta
# recompilar.

# Donde se publica el servicio web. Con "localhost" SOLO lo ven los programas
# de esta misma computadora. Para que lo vea el Servidor Web desde otra
# computadora, poner la IP de esta maquina en la red (la muestra la consola al
# arrancar), por ejemplo 192.168.1.20, o 0.0.0.0 para escuchar en todas.
servicio.host=localhost
servicio.puerto=9128
servicio.ruta=/eventosuy
